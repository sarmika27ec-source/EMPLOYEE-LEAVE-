<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
</head>
<body>

    <h1>Admin Dashboard</h1>

    <hr>

    <h2>Add Leave Type</h2>

    <form id="leaveTypeForm">

        <label>Name:</label>
        <input type="text" id="name" required>

        <br><br>

        <label>Description:</label>
        <input type="text" id="description" required>

        <br><br>

        <label>Maximum Days Per Year:</label>
        <input type="number"
               id="maximumDaysPerYear"
               required>

        <br><br>

        <label>Carry Forward:</label>

        <select id="carryForward">

            <option value="false">No</option>
            <option value="true">Yes</option>

        </select>

        <br><br>

        <button type="submit">
            Add Leave Type
        </button>

    </form>

    <p id="message"></p>

    <hr>

    <h2>Leave Types</h2>

    <table border="1" id="leaveTypeTable">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>Maximum Days</th>
            <th>Carry Forward</th>
            <th>Action</th>
        </tr>

    </table>

    <hr>

    <h2>Employees</h2>

    <table border="1" id="employeeTable">

        <tr>
            <th>ID</th>
            <th>Employee ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Role</th>
            <th>Attendance</th>
            <th>Active</th>
        </tr>

    </table>

    <br>

    <button onclick="logout()">Logout</button>

    <script>

        loadLeaveTypes();
        loadEmployees();


        document.getElementById("leaveTypeForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const leaveType = {

                    name:
                        document.getElementById(
                            "name"
                        ).value,

                    description:
                        document.getElementById(
                            "description"
                        ).value,

                    maximumDaysPerYear:
                        Number(
                            document.getElementById(
                                "maximumDaysPerYear"
                            ).value
                        ),

                    carryForward:
                        document.getElementById(
                            "carryForward"
                        ).value === "true"

                };

                fetch("/api/admin/leave-type", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(leaveType)

                })
                .then(response => response.json())

                .then(data => {

                    document.getElementById(
                        "message"
                    ).innerText =
                        "Leave type added successfully";

                    document.getElementById(
                        "leaveTypeForm"
                    ).reset();

                    loadLeaveTypes();

                });

            });


        function loadLeaveTypes() {

            fetch("/api/admin/leave-types")

                .then(response => response.json())

                .then(data => {

                    const table =
                        document.getElementById(
                            "leaveTypeTable"
                        );

                    while (table.rows.length > 1) {
                        table.deleteRow(1);
                    }

                    data.forEach(type => {

                        const row =
                            table.insertRow();

                        row.insertCell(0).innerText =
                            type.id;

                        row.insertCell(1).innerText =
                            type.name;

                        row.insertCell(2).innerText =
                            type.description;

                        row.insertCell(3).innerText =
                            type.maximumDaysPerYear;

                        row.insertCell(4).innerText =
                            type.carryForward;

                        const actionCell =
                            row.insertCell(5);

                        const deleteButton =
                            document.createElement(
                                "button"
                            );

                        deleteButton.innerText =
                            "Delete";

                        deleteButton.onclick =
                            function() {

                                deleteLeaveType(
                                    type.id
                                );

                            };

                        actionCell.appendChild(
                            deleteButton
                        );

                    });

                });
        }


        function deleteLeaveType(id) {

            if (!confirm(
                "Are you sure you want to delete this leave type?"
            )) {
                return;
            }

            fetch(
                "/api/admin/leave-type/" + id,
                {
                    method: "DELETE"
                }
            )
            .then(response => response.text())

            .then(message => {

                document.getElementById(
                    "message"
                ).innerText = message;

                loadLeaveTypes();

            });
        }


        function loadEmployees() {

            fetch("/api/admin/employees")

                .then(response => response.json())

                .then(data => {

                    const table =
                        document.getElementById(
                            "employeeTable"
                        );

                    data.forEach(employee => {

                        const row =
                            table.insertRow();

                        row.insertCell(0).innerText =
                            employee.id;

                        row.insertCell(1).innerText =
                            employee.employeeId;

                        row.insertCell(2).innerText =
                            employee.employeename;

                        row.insertCell(3).innerText =
                            employee.email;

                        row.insertCell(4).innerText =
                            employee.department;

                        row.insertCell(5).innerText =
                            employee.role;

                        row.insertCell(6).innerText =
                            employee.attendance;

                        row.insertCell(7).innerText =
                            employee.active;

                    });

                });
        }


        function logout() {

            localStorage.clear();

            window.location.href =
                "login.html";
        }

    </script>

</body>
</html>
