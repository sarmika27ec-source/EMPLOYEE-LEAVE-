<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>
</head>

<body>

    <h1>Employee Dashboard</h1>

    <h3 id="welcome"></h3>

    <hr>

    <h2>Leave Balance</h2>

    <table border="1" id="balanceTable">

        <tr>
            <th>Leave Type ID</th>
            <th>Available Days</th>
        </tr>

    </table>

    <br>

    <h2>Apply for Leave</h2>

    <form id="leaveForm">

        <label>Leave Type:</label>

        <select id="leaveTypeId" required>
            <option value="">Select Leave Type</option>
        </select>

        <br><br>

        <label>Start Date:</label>
        <input type="date" id="startDate" required>

        <br><br>

        <label>End Date:</label>
        <input type="date" id="endDate" required>

        <br><br>

        <label>Reason:</label>
        <br>

        <textarea id="reason" rows="4" cols="40" required></textarea>

        <br><br>

        <button type="submit">Apply Leave</button>

    </form>

    <p id="leaveMessage"></p>

    <hr>

    <h2>Leave History</h2>

    <table border="1" id="requestTable">

        <tr>
            <th>Leave Type ID</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Reason</th>
            <th>Status</th>
            <th>Manager Comment</th>
        </tr>

    </table>

    <br>

    <button onclick="logout()">Logout</button>

    <script>

        // Get employee details from the URL
        const urlParams = new URLSearchParams(window.location.search);

        const employeeId = urlParams.get("employeeId");

        const employeeName = urlParams.get("employeeName");


        // Check whether employee ID exists
        if (!employeeId || employeeId === "null") {

            window.location.href = "login.html";

        }


        // Store employee details in localStorage
        localStorage.setItem("employeeId", employeeId);

        localStorage.setItem("employeeName", employeeName);


        // Display welcome message
        document.getElementById("welcome").innerText =
            "Welcome, " + employeeName;


        // Load employee information
        loadBalance();

        loadLeaveTypes();

        loadRequests();


        // Load leave balance
        function loadBalance() {

            fetch("/api/leave/balance/" + employeeId)

                .then(response => {

                    if (!response.ok) {
                        throw new Error("Unable to load leave balance");
                    }

                    return response.json();

                })

                .then(data => {

                    const table =
                        document.getElementById("balanceTable");

                    // Remove old rows except header
                    while (table.rows.length > 1) {
                        table.deleteRow(1);
                    }

                    data.forEach(balance => {

                        const row =
                            table.insertRow();

                        row.insertCell(0).innerText =
                            balance.leaveTypeId;

                        row.insertCell(1).innerText =
                            balance.availableDays;

                    });

                })

                .catch(error => {

                    console.error(error);

                });

        }


        // Load leave types
        function loadLeaveTypes() {

            fetch("/api/leave/types")

                .then(response => {

                    if (!response.ok) {
                        throw new Error("Unable to load leave types");
                    }

                    return response.json();

                })

                .then(data => {

                    const select =
                        document.getElementById("leaveTypeId");

                    data.forEach(type => {

                        const option =
                            document.createElement("option");

                        option.value = type.id;

                        option.text =
                            type.name;

                        select.appendChild(option);

                    });

                })

                .catch(error => {

                    console.error(error);

                });

        }


        // Load leave history
        function loadRequests() {

            fetch("/api/leave/requests/" + employeeId)

                .then(response => {

                    if (!response.ok) {
                        throw new Error("Unable to load leave requests");
                    }

                    return response.json();

                })

                .then(data => {

                    const table =
                        document.getElementById("requestTable");

                    // Remove old rows except header
                    while (table.rows.length > 1) {
                        table.deleteRow(1);
                    }

                    data.forEach(request => {

                        const row =
                            table.insertRow();

                        row.insertCell(0).innerText =
                            request.leaveTypeId;

                        row.insertCell(1).innerText =
                            request.startDate;

                        row.insertCell(2).innerText =
                            request.endDate;

                        row.insertCell(3).innerText =
                            request.reason;

                        row.insertCell(4).innerText =
                            request.status;

                        row.insertCell(5).innerText =
                            request.managerComment || "";

                    });

                })

                .catch(error => {

                    console.error(error);

                });

        }


        // Apply for leave
        document.getElementById("leaveForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const leaveTypeId =
                    document.getElementById("leaveTypeId").value;

                const startDate =
                    document.getElementById("startDate").value;

                const endDate =
                    document.getElementById("endDate").value;

                const reason =
                    document.getElementById("reason").value;


                const request = {

                    employeeId: Number(employeeId),

                    leaveTypeId: Number(leaveTypeId),

                    startDate: startDate,

                    endDate: endDate,

                    reason: reason

                };


                fetch("/api/leave/apply", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(request)

                })

                .then(response => response.text())

                .then(message => {

                    document.getElementById(
                        "leaveMessage"
                    ).innerText = message;


                    // Refresh balance and history
                    loadBalance();

                    loadRequests();


                    // Clear form after successful application
                    if (message === "Leave applied successfully") {

                        document.getElementById(
                            "leaveForm"
                        ).reset();

                    }

                })

                .catch(error => {

                    document.getElementById(
                        "leaveMessage"
                    ).innerText =
                        "Error applying for leave.";

                    console.error(error);

                });

            });


        // Logout
        function logout() {

            localStorage.clear();

            window.location.href = "login.html";

        }

    </script>

</body>

</html>
